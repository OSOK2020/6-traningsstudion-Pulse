    <link rel="stylesheet" href="assets/styles/nav.css">
    <link rel="icon" type="image/png" href="assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="assets/favicon/site.webmanifest" />
    <title>Kontakt oss</title>
</head>
<body>

    <nav>
        <div class="logo"><img src="assets/images/logo.png" alt="Träningsstudion Pulse Logo"></div>
        <ul>
            <li><a href="index.html" rel="noopener noreferrer">Hem</a></li>
            <li><a href="boka.html" rel="noopener noreferrer">Boka</a></li>
            <li><a href="schema.html" rel="noopener noreferrer">Schema</a></li>
            <li><a href="medlemskap.html" rel="noopener noreferrer">Medlemskap</a></li>
            <li><a href="kontakt.html" rel="noopener noreferrer">Kontakt</a></li>
        </ul>
    </nav>
    
    <header>
        <h1>Kontakt oss</h1>
    </header>

    <main>
        <section class="contact-info">
            <h2>Kontaktinformation</h2>
            <p>Har du några frågor eller funderingar? Tveka inte att kontakta oss!</p>
            <ul>
                <li><strong>Telefon:</strong> <a href="tel:+46123-456789">0123-456789</a></li>
                <li><strong>Email:</strong> <a href="mailto:info@traningsstudionpulse.se">info@traningsstudionpulse.se</a></li>
            </ul>
        </section>

        <section class="contact-form">
            <h2>Skicka ett meddelande</h2>
            <form action="#" method="post">
                <label for="name">Namn: <span class="required">*<span></label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email: <span class="required">*<span></label>
                <input type="email" id="email" name="email" required>

                <label for="message">Meddelande: <span class="required">*<span></span></label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Skicka</button>
            </form>
        </section>
    </main>
</body>
</html>
