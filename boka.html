<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boka</title>
</head>
<body>
    <header>
        <h1>Boka in dig på pass i Pulse</h1>
    </header>
    <main>
        <form action="#" method="post">
            <label for="namn">Namn:</label>
            <input type="text" name="namn" id="namn" required placeholder="Ditt namn">

            <label for="email">E-post:</label>
            <input type="email" id="email" name="email" required>

            <fieldset>
                <legend>Pass</legend>
                
            </fieldset>      
        </form>
    </main>
</body>
</html>
