<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="assets/styles/nav.css">
    <link rel="icon" type="image/png" href="assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="assets/favicon/site.webmanifest" />
    <title>Boka</title>
</head>
<body>
    
    <nav>
        <div class="logo"><img src="assets/images/logo.png" alt="Träningsstudion Pulse Logo"></div>
        <ul>
            <li><a href="index.html" target="_blank" rel="noopener noreferrer">Hem</a></li>
            <li><a href="boka.html" target="_blank" rel="noopener noreferrer">Boka</a></li>
            <li><a href="schema.html" target="_blank" rel="noopener noreferrer">Schema</a></li>
            <li><a href="medlemskap.html" target="_blank" rel="noopener noreferrer">Medlemskap</a></li>
            <li><a href="kontakt.html" target="_blank" rel="noopener noreferrer">Kontakt</a></li>
        </ul>
    </nav>

    <header>
        <h1>Boka in dig på pass i Pulse</h1>
    </header>
    <main>
        <form action="#" method="post">
            <div class="userinput">
            <label for="namn">Namn:</label>
            <input type="text" name="namn" id="namn" required placeholder="Ditt namn">

            <label for="email">E-post:</label>
            <input type="email" id="email" name="email" required placeholder="Din E-post">
            </div>
            <div class="submit">
                    <fieldset class="ram">
                        <legend class="ramrubrik">Pass (välj en eller flera)</legend>
                    <table>
                        <tbody>
                            <tr>
                                <td class="ram">
                                    <label for="yoga">Yoga (07:00 - Måndagar)</label>
                                    <input type="checkbox" id="yoga" name="trainingType" value="yoga">
                                </td>
                            </tr>
                            <tr>
                                <td class="ram">
                                    <label for="cirkletraining">Cirkelträning (18:00 - Måndagar)</label>
                                    <input type="checkbox" name="trainingType" id="cirkletraining" value="cirkletraining">
                                </td>
                            </tr>
                            <tr>
                                <td class="ram">
                            <label for="meditation">Meditation (07:30 - Onsdagar)</label>
                            <input type="checkbox" name="trainingType" id="meditation" value="meditation">
                                </td>
                            </tr>
                            <tr>
                                <td class="ram">
                            <label for="zumba">Zumba (19:00 - Onsdagar)</label>
                            <input type="checkbox" name="trainingType" id="zumba" value="zumba">
                                </td>
                            </tr>
                            <tr>
                                <td class="ram">    
                            <label for="simning">Simning (08:30 - Fredagar)</label>
                            <input type="checkbox" name="trainingType" id="simning" value="simning">
                                </td>
                            </tr>
                            <tr>
                                <td class="ram">   
                            <label for="cycling">Cykelträning (17:00 - Fredagar)</label>
                            <input type="checkbox" name="trainingType" id="cycling" value="cycling">
                                </td>
                            </tr>
                    </fieldset> 
                </tbody>  
            </table> 
            <button type="submit" class="boka-btn">Boka</button>  
            </div>
        </form>
        <form action="#" method="post" class="meddelandeform">
            <label for="onskad-dag">Önskade dagar</label>
            <div class="selectors">
            <select id="onskad-dag" name="onskad-dag" required multiple size="5">
                <option value="">Välj dag (CTRL+klick)</option>
                <option value="måndag">Måndag</option>
                <option value="tisdag">Tisdag</option>
                <option value="onsdag">Onsdag</option>
                <option value="Torsdag">Torsdag</option>
                <option value="fredag">Fredag</option>
            </select>
            </div>
            <label for="meddelande">Meddelande</label>
            <textarea id="meddelande" name="meddelande" rows="6"></textarea>
            <button type="submit">Skicka in önskning</button>
        </form>
    </main>
</body>
</html>
